name: LingoTBMS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, pdo_pgsql, redis

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies
        run: |
          cp .env.example .env
          composer install --prefer-dist --no-interaction
          npm ci
          npm run build
          php artisan key:generate

      - name: Provision app role and test database
        env:
          PGPASSWORD: password
        run: |
          psql -h 127.0.0.1 -p 5432 -U root -d postgres -c "CREATE ROLE lingotbms_app LOGIN PASSWORD 'password' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;"
          psql -h 127.0.0.1 -p 5432 -U root -d postgres -c "CREATE DATABASE lingotbms_test OWNER lingotbms_app;"

      - name: Lint
        run: composer lint

      - name: Run tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: lingotbms_test
          DB_USERNAME: lingotbms_app
          DB_PASSWORD: password
          REDIS_HOST: 127.0.0.1
        run: composer test